<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>How well do you know your partner? 你有多了解TA?</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fafafa;color:#222;display:flex;justify-content:center;padding:16px}
.c{max-width:480px;width:100%}h1{font-size:23px;margin:8px 0 12px;text-align:center}h2{font-size:19px;line-height:1.3;margin:8px 0}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin:12px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 14px}
.o{display:block;width:100%;text-align:left;background:#fff;margin:8px 0;border:1.5px solid #ddd}.o:hover,.o:active{border-color:#2a5bd7;background:#f1f5ff}
.p{background:#2a5bd7;color:#fff;width:100%;margin-top:10px}.s{background:#eee;width:100%;margin-top:10px}
.lg{background:#fff;border:1px solid #ddd;padding:6px 12px;font-size:14px}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1.5px solid #ddd;margin:6px 0}
code{word-break:break-all;display:block;background:#f1f1f1;padding:10px;border-radius:8px;margin:8px 0}
.bar{height:6px;background:#eee;border-radius:3px}.bar i{display:block;height:6px;background:#2a5bd7;border-radius:3px}
.m{background:#e8f6ec}.d{background:#fdeeee}.r{padding:10px;border-radius:10px;margin:6px 0;font-size:14px}
.big{font-size:48px;text-align:center;margin:0;color:#2a5bd7}
.sel{border-color:#2a5bd7!important;background:#f1f5ff!important}
.ban{padding:10px;border-radius:10px;text-align:center;font-weight:600;margin-bottom:8px}.ban.self{background:#f1f1f1}.ban.guess{background:#e8efff;color:#2a5bd7}
.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style></head><body><div class="c" id="app"></div>
<script>
const Q=[
["Favorite cuisine?|最喜欢的菜系?",["Italian|意大利菜","Chinese|中餐","Japanese|日本菜","Mexican|墨西哥菜"]],
["Coffee order?|咖啡点什么?",["Latte or cappuccino|拿铁或卡布奇诺","Black coffee|黑咖啡","Tea instead|改喝茶","No caffeine|不喝咖啡因"]],
["Ideal holiday?|理想的假期?",["Beach|海边","City trip|城市游","Mountains|山里","Road trip|自驾游"]],
["Role in the group chat? 📱|群聊里的角色?",["Lurker, never replies|潜水员,从不回复","Trip planner|旅行策划师","Meme sender|表情包大王","Random voice notes|乱发语音的人"]],
["Favorite movie genre?|最喜欢的电影类型?",["Comedy|喜剧","Thriller|惊悚片","Romance|爱情片","Sci-fi|科幻片"]],
["Dream pet?|梦想中的宠物?",["Dog|狗","Cat|猫","Horse|马","Parrot|鹦鹉"]],
["Favorite season?|最喜欢的季节?",["Spring|春天","Summer|夏天","Autumn|秋天","Winter|冬天"]],
["When stressed...|压力大的时候……",["Sleep|睡觉","Exercise|运动","Do something random|做点随机的事","Talk to someone|找人聊天"]],
["Worst habit? 🙈|最糟糕的习惯?",["Snoozing the alarm|赖床","Phone in bed|床上玩手机","Cups everywhere|到处放杯子","Overthinking|想太多"]],
["Pick a superpower|选一个超能力",["Fly|飞行","Invisibility|隐身","Read minds|读心术","Time travel|时间旅行"]],
["Biggest fear?|最害怕什么?",["Spiders|蜘蛛","Heights|高处","Public speaking|当众演讲","Being alone|孤单"]],
["Biggest pet peeve?|最讨厌什么?",["Being late|迟到","Loud chewing|吧唧嘴","A messy house|房间乱","Slow walkers|走路慢"]],
["Stuck in an elevator for an hour... 🛗|被困在电梯里一小时……",["Sing loudly|大声唱歌","Take a nap|睡一觉","Look for a way out|想办法逃出去","Make friends with everyone|和大家交朋友"]],
["Perfect Friday night?|完美的周五晚上?",["Cozy at home|在家放松","Try somewhere new|去没去过的地方","A party|派对","No plan, see what happens|没计划,随缘"]],
["Singing in the shower? 🚿|洗澡时唱歌?",["Full opera|飙歌剧","Pop hits|流行歌","Silent|不唱","Random noises|乱哼"]],
["Zombie apocalypse role? 🧟|僵尸末日的角色?",["Leader|领袖","Chef|厨师","Scouts for supplies|出去找物资","Becomes a zombie|变成僵尸"]],
["Social battery?|社交电量?",["Big parties|大型聚会","Small adventure with 1-2 friends|和一两个朋友小冒险","Alone time|独处","Depends on my mood|看心情"]],
["Best gift?|最好的礼物?",["An experience|一次体验","Something handmade|手工礼物","Time with friends|和朋友相处的时间","A surprise|惊喜"]],
["Spontaneous trip tomorrow? ✈️|明天说走就走旅行?",["Can't, needs a plan|不行,需要计划","Yes, packing now!|好!现在就收拾","Only if friends come|朋友去才去","Already left|已经出发了"]],
["Dream home?|梦想的家?",["City apartment|城市公寓","House with a garden|带花园的房子","Cabin in nature|自然中的小屋","Houseboat or van|船屋或房车"]]
];
const S={
en:{title:"How well do you know your partner?",intro:"20 questions. Step 1: answer what you think your partner would pick, then send them your code.",step2:"Step 2: paste the code your partner sent you, answer the questions about yourself, and see how well they know you.",yourname:"Your name",b1:"1. Answer for my partner",b2:"2. Check how my partner filled it in",paste:"Partner's code",bad:"That code doesn't look right.",about:"🙋 Answer about yourself",guess:"🎯 What do you think your partner would pick?",done:"Done! 🎉",send:"Send this code to your partner:",copy:"Copy code",then:"Next: check how my partner filled it in",score:"How well your partner knows you",yg:"Your answer",real:"Their guess",again:"Start over",home:"Home",yourp:"Your personality",why:"Because you picked",pros:"Pros",cons:"Struggles",back:"Back",fwd:"Forward",yes:["They got it! 🎯","They know you! 💕","Mind reader! 🔮","Spot on! 💥"],no:["Oops! 😅","Not quite! 🙈","Plot twist! 🌀","Time for a date-night chat 😏"],next:"Next →",streak:"Streak",v:["Soulmate level 🧠❤️","You know them well 💕","Not bad, keep learning 🙂","Ask more questions 🤔","Strangers? 😂"]},
zh:{title:"你有多了解TA?",intro:"20 道题。第一步:回答你觉得TA会选什么,然后把代码发给TA。",step2:"第二步:粘贴TA发给你的代码,回答关于你自己的题,看看TA有多了解你。",yourname:"你的名字",b1:"1. 替TA回答",b2:"2. 看看TA怎么填的",paste:"对方的代码",bad:"代码好像不对。",about:"🙋 回答关于你自己的",guess:"🎯 你觉得TA会选哪个?",done:"完成!🎉",send:"把这个代码发给对方:",copy:"复制代码",then:"下一步:看看TA怎么填的",score:"TA有多了解你",yg:"你的答案",real:"TA猜的",again:"重新开始",home:"首页",yourp:"你的性格",why:"因为你选了",pros:"优点",cons:"挑战",back:"返回",fwd:"前进",yes:["TA猜对了!🎯","TA懂你!💕","读心高手!🔮","正中!💥"],no:["哎呀!😅","不太对!🙈","剧情反转!🌀","该约会聊聊了 😏"],next:"下一题 →",streak:"连对",v:["灵魂伴侣级别 🧠❤️","你很了解TA 💕","还不错,继续了解 🙂","多问问TA吧 🤔","是陌生人吗?😂"]}};
const L="ABCD";let streak=0,lang="en",scr="home",mode="self",name="",pname="",pans="",pcode="",ans=[],i=0;const $=document.getElementById("app");
const t=k=>S[lang][k],pk=s=>s.split("|")[lang=="en"?0:1],cl=s=>s.replace(/[<>"&~]/g,"").trim();
const hdr=()=>`<div style="display:flex;justify-content:space-between">${scr=="home"?"<span></span>":`<span><button class=lg onclick="back()">← ${t("back")}</button> <button class=lg onclick="scr='home';render()">🏠</button>${fwdOk()?`<button class=lg onclick="fwd()">${t("fwd")} →</button>`:""}</span>`}<button class=lg onclick="tg()">🌐 ${lang=="en"?"中文":"English"}</button></div>`;
function tg(){const n=document.getElementById("n"),p=document.getElementById("pc");if(n)name=cl(n.value);if(p)pcode=p.value;lang=lang=="en"?"zh":"en";render()}
function render(){({home,ask,sdone,res,fb})[scr]()}
function home(){$.innerHTML=hdr()+`<h1>${t("title")}</h1><div class=card><p>${t("intro")}</p><input id=n value="${name}" placeholder="${t("yourname")}"><button class=p onclick="go('guess')">${t("b1")}</button></div><div class=card><p>${t("step2")}</p><textarea id=pc rows=2 placeholder="${t("paste")}">${pcode.replace(/[<>&]/g,"")}</textarea><button class=p onclick="go('self')">${t("b2")}</button><p id=err style="color:#c33"></p></div>`}
function go(m){name=cl(document.getElementById("n").value)||"Me";pcode=document.getElementById("pc").value;
if(m=="self"){const[pn,pa]=pcode.trim().split("~");if(!pa||pa.length!=Q.length||!/^[ABCD]+$/.test(pa)){document.getElementById("err").textContent=t("bad");return}pname=pn.replace(/_/g," ");pans=pa}
mode=m;ans=[];i=0;streak=0;scr="ask";render()}
function ask(){const[q,o]=Q[i];$.innerHTML=hdr()+`<div class=bar><i style="width:${i/Q.length*100}%"></i></div><div class=card><div class="ban ${mode}">${mode=="self"?t("about"):t("guess")}</div><small>${i+1} / ${Q.length}</small><h2>${pk(q)}</h2>${o.map((x,k)=>`<button class="o${ans[i]==L[k]?" sel":""}" onclick="pick(${k})">${pk(x)}</button>`).join("")}</div>`}
function fwdOk(){return (scr=="ask"&&ans[i]!==undefined)||scr=="fb"}
function back(){if(scr=="ask"){if(i==0)scr="home";else i--}else if(scr=="fb")scr="ask";else{i=Q.length-1;scr="ask"}render()}
function fwd(){if(scr=="fb"){nx();return}if(i+1<Q.length){i++;render()}else{i=Q.length;scr=mode=="self"?"res":"sdone";render()}}
function pick(k){ans[i]=L[k];if(mode=="self"){scr="fb";render();return}i++;if(i<Q.length)render();else{scr="sdone";render()}}
function fb(){const k=i,ok=ans[k]==pans[k],q=Q[k],a=t(ok?"yes":"no"),line=a[Math.floor(Math.random()*a.length)];$.innerHTML=hdr()+`<div class=bar><i style="width:${(k+1)/Q.length*100}%"></i></div><div class=card style="text-align:center"><p class="big">${ok?"✅":"❌"}</p><h2>${line}</h2>${ok?"":`<p>${t("real")}: <b>${pk(q[1][L.indexOf(pans[k])])}</b></p>`}<button class=p onclick="nx()">${t("next")}</button></div>`}
function nx(){i++;scr=i<Q.length?"ask":"res";render()}
function sdone(){$.innerHTML=hdr()+`<h1>${t("done")}</h1><div class=card><p>${t("send")}</p><code id=cd>${name.replace(/\s/g,"_")}~${ans.join("")}</code><button class=p onclick="cp()">${t("copy")}</button><button class=s onclick="scr='home';render()">${t("then")}</button></div>`}
function cp(){try{navigator.clipboard.writeText(document.getElementById("cd").textContent)}catch(e){}}
const W={2:"ACBD",3:"ABCD",4:"CBAD",5:"CABD",7:"ABDC",9:"BACD",12:"DABC",13:"ABCD",15:"CABD",16:"CBAD",17:"BACD",18:"ABCD",19:"CABD"};
const TY={
A:{n:"Cozy Dreamer 🛋️|宅家梦想家",d:"Home is your happy place. You make the best snacks and the best plans for doing nothing.|家是你的快乐星球。你最会准备零食,也最会享受什么都不做。",p:["Calm and loyal|平静又忠诚","Makes people feel safe|让人很有安全感"],c:["Hard to leave the couch|很难离开沙发","Change makes you nervous|害怕改变"]},
B:{n:"Adventurer 🧗|冒险家",d:"You chase the next view. If there's a cliff, you want to see the top.|你总在追逐下一片风景。看到悬崖,你就想爬上去。",p:["Brave and curious|勇敢又好奇","Always up for something new|总愿意尝试新事物"],c:["Gets bored fast|很容易无聊","Rest feels like wasted time|休息像是浪费时间"]},
C:{n:"Social Butterfly 🦋|社交蝴蝶",d:"People give you energy. You're the glue of every group chat.|朋友给你能量。你是每个群聊的粘合剂。",p:["Warm and fun to be around|温暖有趣","Makes friends everywhere|到哪都能交朋友"],c:["Alone time feels hard|很难享受独处","Says yes to too many plans|答应太多邀约"]},
D:{n:"Wildcard 🎲|万能变数",d:"Nobody knows what you'll do next, including you.|没人知道你下一步会做什么,包括你自己。",p:["Flexible and funny|灵活又好笑","Improvises well in a crisis|危机时很会随机应变"],c:["Plans? What plans?|计划?什么计划?","Hard to pin down|很难被捉摸"]}};
function pcard(){const c={A:0,B:0,C:0,D:0};const last={};for(const k in W){const x=ans[k];if(x){const y=W[k][L.indexOf(x)];c[y]++;last[y]=+k}}const key=Object.keys(c).sort((a,b)=>c[b]-c[a]||(last[b]||0)-(last[a]||0))[0],T=TY[key],why=Object.keys(W).filter(k=>ans[k]&&W[k][L.indexOf(ans[k])]==key).slice(0,4).map(k=>pk(Q[k][1][L.indexOf(ans[k])])).join(", "),li=a=>a.map(x=>`<li>${pk(x)}</li>`).join("");return `<div class=card><small>${t("yourp")}</small><h2>${pk(T.n)}</h2><p>${pk(T.d)}</p><p><small>${t("why")}: ${why}</small></p><b>👍 ${t("pros")}</b><ul>${li(T.p)}</ul><b>⚠️ ${t("cons")}</b><ul>${li(T.c)}</ul></div>`}
function res(){let m=0,h="";Q.forEach((q,k)=>{const ok=ans[k]==pans[k];if(ok)m++;h+=`<div class="r ${ok?"m":"d"}"><b>${pk(q[0])}</b><br>${t("yg")}: ${pk(q[1][L.indexOf(ans[k])])}${ok?" ✓":`<br>${t("real")}: ${pk(q[1][L.indexOf(pans[k])])}`}</div>`});
const v=t("v")[m>=18?0:m>=14?1:m>=10?2:m>=6?3:4];$.innerHTML=hdr()+`<h1>${t("score")}</h1><div class=card><p class=big>${m} / ${Q.length}</p><h2 style="text-align:center">${v}</h2></div>${pcard()}${h}<button class=s onclick="scr='home';render()">${t("again")}</button>`}
render();
</script></body></html>
